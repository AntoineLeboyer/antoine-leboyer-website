<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hravuta News — Jewish Wisdom on Today's Headlines · Antoine Leboyer</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --navy:   #1a1a2e;
      --gold:   #c9973a;
      --cream:  #fafaf8;
      --mid:    #f0ede6;
      --light:  #7a7a8a;
      --border: #ddd8ce;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Georgia', serif; color: var(--navy); background: var(--cream); line-height: 1.7; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
    p  { margin-bottom: 1rem; }
    a  { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px;
    }
    .nav-logo { color: #fff; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .nav-back  { color: rgba(255,255,255,0.7); font-family: 'Helvetica Neue', sans-serif; font-size: 0.82rem; letter-spacing: 0.07em; text-transform: uppercase; transition: color 0.2s; }
    .nav-back:hover { color: var(--gold); }

    /* ── Hero ── */
    #hero { background: var(--navy); color: #fff; padding: 4rem 2rem 4.5rem; text-align: center; }
    .eyebrow {
      font-family: 'Helvetica Neue', sans-serif;
      font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1rem;
    }
    #hero h1 { color: #fff; margin-bottom: 1rem; }
    #hero .subtitle {
      color: rgba(255,255,255,0.65); max-width: 560px;
      margin: 0 auto 2.5rem; font-size: 1.05rem; line-height: 1.7;
    }

    /* ── URL Form ── */
    .url-form { display: flex; gap: 0.75rem; max-width: 640px; margin: 0 auto; }
    .url-input {
      flex: 1; padding: 0.9rem 1.25rem;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff;
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.95rem;
      border-radius: 2px; outline: none; transition: border-color 0.2s;
    }
    .url-input::placeholder { color: rgba(255,255,255,0.35); }
    .url-input:focus { border-color: var(--gold); }
    .btn-explore {
      padding: 0.9rem 1.75rem;
      background: var(--gold); color: #fff;
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.82rem;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px; transition: background 0.2s; white-space: nowrap;
    }
    .btn-explore:hover  { background: #b5852e; }
    .btn-explore:disabled { opacity: 0.55; cursor: not-allowed; }
    #status {
      min-height: 2rem; padding: 0.75rem 1rem;
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.85rem;
      color: rgba(255,255,255,0.55); text-align: center;
    }
    #status.error { color: #f08080; }

    /* ── Results ── */
    #results { display: none; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 2rem; }

    /* Article card */
    .article-card {
      background: #fff; border-left: 3px solid var(--gold);
      padding: 1.75rem 2rem; margin: 2rem auto;
      max-width: 860px; border-radius: 0 2px 2px 0;
    }
    .article-card .label {
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); margin-bottom: 0.4rem;
    }
    .article-card h2 { font-size: 1.2rem; margin-bottom: 0.4rem; }
    .article-card .desc { color: var(--light); font-size: 0.88rem; margin-bottom: 0.4rem; }
    .article-card .url-text { font-family: 'Helvetica Neue', sans-serif; font-size: 0.75rem; color: #bbb; word-break: break-all; }

    /* Keywords */
    .keywords-wrap { max-width: 860px; margin: 0 auto; padding: 0 2rem 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .kw-label { font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--light); margin-right: 0.25rem; }
    .kw-tag {
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      padding: 0.25rem 0.75rem; border: 1px solid var(--border);
      border-radius: 99px; color: var(--navy); background: #fff;
    }

    /* Wisdom section */
    #wisdom { padding: 2.5rem 2rem 4rem; max-width: 860px; margin: 0 auto; }
    #wisdom .section-label {
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.4rem;
    }
    #wisdom h2 { margin-bottom: 0.5rem; }
    .divider { width: 40px; height: 3px; background: var(--gold); margin-bottom: 2rem; }

    /* Passage card */
    .passage {
      background: #fff; border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      padding: 1.75rem; margin-bottom: 1.25rem; border-radius: 0 0 2px 2px;
    }
    .passage-ref {
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.78rem;
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 0.75rem;
    }
    .passage-he {
      direction: rtl; text-align: right;
      font-size: 1.1rem; line-height: 1.9; color: var(--navy);
      font-style: italic; margin-bottom: 0.75rem;
    }
    .passage-en { font-size: 0.93rem; color: #333; line-height: 1.75; }
    .passage-cat {
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.7rem;
      color: var(--light); letter-spacing: 0.07em; margin-top: 0.9rem;
    }
    .passage-link {
      display: inline-block; margin-top: 0.75rem;
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.75rem;
      color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase;
      border-bottom: 1px solid var(--gold); padding-bottom: 1px;
    }
    .passage-link:hover { color: #b5852e; border-color: #b5852e; }

    .no-results { text-align: center; padding: 3rem; color: var(--light); font-style: italic; }

    @media (max-width: 580px) {
      .url-form { flex-direction: column; }
      .article-card { margin: 1.5rem 1rem; }
      #wisdom { padding: 2rem 1rem 3rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo" style="color:#fff;">Antoine Leboyer</a>
  <a href="index.html" class="nav-back">← Back to site</a>
</nav>

<section id="hero">
  <p class="eyebrow">Virtual Hravuta · AI &amp; Jewish Texts</p>
  <h1>Hravuta News</h1>
  <p class="subtitle">Paste a news article URL — discover what Jewish wisdom and philosophy have to say about it, powered by <a href="https://www.sefaria.org" target="_blank" rel="noopener noreferrer" style="color:var(--gold);border-bottom:1px solid var(--gold);">Sefaria</a>.</p>

  <form class="url-form" id="url-form">
    <input type="url" id="url-input" class="url-input"
           placeholder="https://www.lemonde.fr/article..." required />
    <button type="submit" id="explore-btn" class="btn-explore">Explore →</button>
  </form>
  <div id="status"></div>
</section>

<div id="results">
  <div class="container">
    <div id="article-display"></div>
    <div class="keywords-wrap" id="keywords-wrap"></div>
  </div>
  <section id="wisdom">
    <p class="section-label">Sefaria · Jewish Texts</p>
    <h2>What Jewish Wisdom Says</h2>
    <div class="divider"></div>
    <div id="passages"></div>
  </section>
</div>

<script>
/* ── Stop words ── */
const STOP = new Set(['a','an','the','is','are','was','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','must','shall','can','to','of','in','for','on','with','at','by','from','into','about','as','that','this','it','its','they','them','their','he','she','we','you','i','me','my','his','her','our','your','who','which','when','where','how','what','why','not','no','nor','so','yet','but','and','or','if','then','because','while','although','though','after','before','since','until','unless','upon','any','all','also','up','out','over','under','again','across','through','during','without','per','new','said','says','say','year','years','people','time','way','more','most','other','some','such','than','too','very','just','now','each','both','here','there','back','into','about','still','well','even','own','like','one','two','three','four','five','six','seven','eight','nine','ten','first','second','third','last','next','get','got','make','made','take','took','give','gave','come','came','went','know','think','see','look','want','find','work','show','tell','need','used','s','re','ve','ll','d','t','m','us','its','he','she','been','had','would','these','those','much','many','only']);

/* ── Strip HTML → plain text ── */
function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  d.querySelectorAll('script,style,nav,header,footer,aside,noscript').forEach(el => el.remove());
  return (d.textContent || d.innerText || '').replace(/\s+/g, ' ').trim();
}

/* ── Keyword extraction ── */
function extractKeywords(text, n = 6) {
  const words = text.toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/)
    .filter(w => w.length > 4 && !STOP.has(w));
  const freq = {};
  words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
  return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, n).map(([w]) => w);
}

/* ── UI helpers ── */
function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

/* ── Fetch article via CORS proxy ── */
async function fetchArticle(url) {
  setStatus('Fetching article…');
  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
  const res = await fetch(proxy, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error('Could not reach the article. Try another URL.');
  const data = await res.json();
  if (!data.contents) throw new Error('Article content could not be retrieved.');
  return data.contents;
}

/* ── Parse article HTML ── */
function parseArticle(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const get = (sel) => doc.querySelector(sel)?.content || doc.querySelector(sel)?.textContent || '';

  const title = get('meta[property="og:title"]') || get('meta[name="twitter:title"]') || get('title');
  const desc  = get('meta[property="og:description"]') || get('meta[name="description"]') || get('meta[name="twitter:description"]');

  const body = doc.querySelector('article') || doc.querySelector('[role="main"]') || doc.querySelector('main') || doc.body;
  const bodyText = stripHtml(body?.innerHTML || '');

  return { title: title.trim(), desc: desc.trim(), bodyText };
}

/* ── Search Sefaria ── */
async function searchSefaria(query, size = 12) {
  const params = new URLSearchParams({ query, type: 'text', field: 'naive_lemmatizer', sort_type: 'relevance', size });
  const res = await fetch(`https://www.sefaria.org/api/search-wrapper/?${params}`, { signal: AbortSignal.timeout(12000) });
  if (!res.ok) throw new Error('Sefaria search failed. Please try again.');
  return res.json();
}

/* ── Render passages ── */
function renderPassages(hits) {
  const container = document.getElementById('passages');
  container.innerHTML = '';

  if (!hits?.length) {
    container.innerHTML = '<p class="no-results">No passages found. Try a different article or check back — Sefaria covers thousands of texts.</p>';
    return;
  }

  const seen = new Set();
  let shown = 0;

  hits.forEach(hit => {
    if (shown >= 7) return;
    const src = hit._source || {};
    const ref  = src.ref || src.heRef || '';
    const en   = Array.isArray(src.exact) ? src.exact.join(' ') : (src.exact || src.text || '');
    const he   = Array.isArray(src.he)    ? src.he.join(' ')    : (src.he    || '');
    const cats = Array.isArray(src.categories) ? src.categories.join(' · ') : '';
    const slug = ref.replace(/\s/g, '_');

    if (!ref || seen.has(ref) || (!en && !he)) return;
    seen.add(ref);
    shown++;

    const card = document.createElement('div');
    card.className = 'passage';
    card.innerHTML = `
      <div class="passage-ref">${ref}</div>
      ${he ? `<div class="passage-he">${he}</div>` : ''}
      ${en ? `<p class="passage-en">${en.replace(/<[^>]+>/g, '')}</p>` : ''}
      ${cats ? `<div class="passage-cat">${cats}</div>` : ''}
      <a class="passage-link" href="https://www.sefaria.org/${encodeURIComponent(slug)}" target="_blank" rel="noopener noreferrer">Read on Sefaria →</a>
    `;
    container.appendChild(card);
  });

  if (!shown) {
    container.innerHTML = '<p class="no-results">No passages found for these themes. Try another article.</p>';
  }
}

/* ── Main handler ── */
document.getElementById('url-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  const btn = document.getElementById('explore-btn');
  btn.disabled = true;
  document.getElementById('results').style.display = 'none';

  try {
    const html = await fetchArticle(url);

    setStatus('Parsing article…');
    const { title, desc, bodyText } = parseArticle(html);

    // Article display
    document.getElementById('article-display').innerHTML = `
      <div class="article-card">
        <div class="label">Article</div>
        <h2>${title || 'Article'}</h2>
        ${desc ? `<p class="desc">${desc}</p>` : ''}
        <div class="url-text">${url}</div>
      </div>
    `;

    // Keywords
    setStatus('Identifying key themes…');
    const combined = [title, desc, bodyText.slice(0, 1500)].join(' ');
    const keywords = extractKeywords(combined, 7);

    document.getElementById('keywords-wrap').innerHTML =
      `<span class="kw-label">Themes:</span>` +
      keywords.map(k => `<span class="kw-tag">${k}</span>`).join('');

    // Sefaria search
    setStatus('Searching Jewish texts via Sefaria…');
    const query = keywords.slice(0, 4).join(' ');
    const data = await searchSefaria(query);

    document.getElementById('results').style.display = 'block';
    renderPassages(data?.hits?.hits || []);
    setStatus('');

    document.getElementById('wisdom').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    setStatus(err.message || 'Something went wrong. Please try again.', true);
  } finally {
    btn.disabled = false;
  }
});
</script>

<script data-goatcounter="https://antoineleboyer.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
