<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hravuta News — Jewish Wisdom on Today's Headlines · Antoine Leboyer</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --navy:   #1a1a2e;
      --gold:   #c9973a;
      --cream:  #fafaf8;
      --mid:    #f0ede6;
      --light:  #7a7a8a;
      --border: #ddd8ce;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Georgia', serif; color: var(--navy); background: var(--cream); line-height: 1.7; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 700; letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.2rem, 3vw, 1.7rem); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
    h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.35rem; }
    p  { margin-bottom: 1rem; }
    a  { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--navy);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 60px;
    }
    .nav-logo { color: #fff; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .nav-back  { color: rgba(255,255,255,0.7); font-family: 'Helvetica Neue', sans-serif; font-size: 0.82rem; letter-spacing: 0.07em; text-transform: uppercase; transition: color 0.2s; }
    .nav-back:hover { color: var(--gold); }

    /* ── Hero ── */
    #hero { background: var(--navy); color: #fff; padding: 4rem 2rem 4.5rem; text-align: center; }
    .eyebrow { font-family: 'Helvetica Neue', sans-serif; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
    #hero h1 { color: #fff; margin-bottom: 1rem; }
    #hero .subtitle { color: rgba(255,255,255,0.65); max-width: 580px; margin: 0 auto 2.5rem; font-size: 1.05rem; line-height: 1.75; }

    /* ── Form ── */
    .url-form { display: flex; gap: 0.75rem; max-width: 660px; margin: 0 auto; }
    .url-input {
      flex: 1; padding: 0.9rem 1.25rem;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff;
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.95rem;
      border-radius: 2px; outline: none; transition: border-color 0.2s;
    }
    .url-input::placeholder { color: rgba(255,255,255,0.35); }
    .url-input:focus { border-color: var(--gold); }
    .btn-explore {
      padding: 0.9rem 1.75rem;
      background: var(--gold); color: #fff;
      font-family: 'Helvetica Neue', sans-serif; font-size: 0.82rem;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      border: none; cursor: pointer; border-radius: 2px;
      transition: background 0.2s; white-space: nowrap;
    }
    .btn-explore:hover    { background: #b5852e; }
    .btn-explore:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Status / loader ── */
    #status { min-height: 2.5rem; padding: 0.75rem 1rem; font-family: 'Helvetica Neue', sans-serif; font-size: 0.85rem; color: rgba(255,255,255,0.55); text-align: center; }
    #status.error { color: #f08080; }
    .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Results ── */
    #results { display: none; }

    /* Article banner */
    .article-banner {
      background: var(--navy); color: #fff;
      padding: 2rem 2rem 2.25rem; border-bottom: 3px solid var(--gold);
    }
    .article-banner .label { font-family: 'Helvetica Neue', sans-serif; font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
    .article-banner h2 { color: #fff; font-size: clamp(1.1rem, 2.5vw, 1.5rem); margin-bottom: 0.5rem; }
    .article-banner .headline { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-bottom: 0.25rem; }
    .article-banner .url-text { font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem; color: rgba(255,255,255,0.35); word-break: break-all; }

    /* Jewish lens overview */
    .jewish-lens {
      background: var(--mid); border-left: 3px solid var(--gold);
      padding: 1.5rem 2rem; font-size: 1rem; line-height: 1.8; color: var(--navy);
    }
    .jewish-lens strong { color: var(--navy); }

    /* Topics */
    .topics-wrap { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
    .topics-label { font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.4rem; }
    .topics-wrap > h2 { margin-bottom: 0.5rem; }
    .divider { width: 40px; height: 3px; background: var(--gold); margin-bottom: 2rem; }

    /* Topic card */
    .topic-card { background: #fff; border: 1px solid var(--border); border-top: 3px solid var(--gold); padding: 1.75rem; margin-bottom: 1.5rem; border-radius: 0 0 2px 2px; }
    .topic-head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
    .topic-concept { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
    .topic-hebrew { font-size: 1.05rem; color: var(--gold); font-style: italic; direction: rtl; }
    .topic-relevance { font-size: 0.93rem; color: #333; line-height: 1.75; margin-bottom: 1.25rem; border-left: 2px solid var(--border); padding-left: 1rem; }

    /* Passages */
    .passages-label { font-family: 'Helvetica Neue', sans-serif; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--light); margin-bottom: 0.75rem; }
    .passage { background: var(--cream); border: 1px solid var(--border); padding: 1.25rem; margin-bottom: 0.75rem; border-radius: 2px; }
    .passage:last-child { margin-bottom: 0; }
    .passage-ref { font-family: 'Helvetica Neue', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
    .passage-he  { direction: rtl; text-align: right; font-size: 1.05rem; line-height: 1.9; color: var(--navy); font-style: italic; margin-bottom: 0.5rem; }
    .passage-en  { font-size: 0.88rem; color: #444; line-height: 1.7; }
    .passage-cat { font-family: 'Helvetica Neue', sans-serif; font-size: 0.68rem; color: var(--light); margin-top: 0.5rem; }
    .passage-link { display: inline-block; margin-top: 0.5rem; font-family: 'Helvetica Neue', sans-serif; font-size: 0.72rem; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 1px solid var(--gold); padding-bottom: 1px; }
    .passage-link:hover { color: #b5852e; border-color: #b5852e; }
    .no-passage { font-family: 'Helvetica Neue', sans-serif; font-size: 0.82rem; color: var(--light); font-style: italic; }

    @media (max-width: 580px) {
      .url-form { flex-direction: column; }
      .topics-wrap { padding: 2rem 1rem 3rem; }
      .article-banner, .jewish-lens { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo" style="color:#fff;">Antoine Leboyer</a>
  <a href="index.html" class="nav-back">← Back to site</a>
</nav>

<section id="hero">
  <p class="eyebrow">Virtual Hravuta · AI &amp; Jewish Texts</p>
  <h1>Hravuta News</h1>
  <p class="subtitle">Paste a news article URL. Claude reads it and finds the Jewish philosophical and ethical texts from <a href="https://www.sefaria.org" target="_blank" rel="noopener noreferrer" style="color:var(--gold);border-bottom:1px solid var(--gold);">Sefaria</a> that illuminate the situation.</p>

  <form class="url-form" id="url-form">
    <input type="url" id="url-input" class="url-input" placeholder="https://www.lemonde.fr/…  or  https://www.nytimes.com/…" required />
    <button type="submit" id="explore-btn" class="btn-explore">Explore →</button>
  </form>
  <div id="status"></div>
</section>

<div id="results">
  <div id="article-banner" class="article-banner">
    <div class="label">Article</div>
    <h2 id="res-title"></h2>
    <p class="headline" id="res-headline"></p>
    <div class="url-text" id="res-url"></div>
  </div>

  <div class="jewish-lens" id="res-lens"></div>

  <div class="topics-wrap">
    <p class="topics-label">Sefaria · Jewish Texts</p>
    <h2>Jewish Wisdom on This Situation</h2>
    <div class="divider"></div>
    <div id="topics-container"></div>
  </div>
</div>

<script>
function setStatus(msg, isError = false) {
  const el = document.getElementById('status');
  el.className = isError ? 'error' : '';
  el.innerHTML = msg ? (isError ? msg : `<span class="loader"></span>${msg}`) : '';
}

function renderPassage(p) {
  const slug = p.ref.replace(/\s/g, '_');
  return `
    <div class="passage">
      <div class="passage-ref">${p.ref}</div>
      ${p.he ? `<div class="passage-he">${p.he}</div>` : ''}
      ${p.en ? `<p class="passage-en">${p.en}</p>` : ''}
      ${p.categories ? `<div class="passage-cat">${p.categories}</div>` : ''}
      <a class="passage-link" href="https://www.sefaria.org/${encodeURIComponent(slug)}" target="_blank" rel="noopener noreferrer">Read on Sefaria →</a>
    </div>`;
}

function renderTopics(topics) {
  const container = document.getElementById('topics-container');
  container.innerHTML = '';

  topics.forEach(t => {
    const passagesHtml = t.passages && t.passages.length
      ? `<div class="passages-label">Relevant texts from Sefaria</div>` + t.passages.map(renderPassage).join('')
      : `<p class="no-passage">No Sefaria passages found for this theme — try searching <a href="https://www.sefaria.org/search#${encodeURIComponent(t.sefaria_query || t.concept)}" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">directly on Sefaria</a>.</p>`;

    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `
      <div class="topic-head">
        <span class="topic-concept">${t.concept}</span>
        ${t.hebrew ? `<span class="topic-hebrew">${t.hebrew}</span>` : ''}
      </div>
      <p class="topic-relevance">${t.relevance}</p>
      ${passagesHtml}
    `;
    container.appendChild(card);
  });
}

document.getElementById('url-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;

  const btn = document.getElementById('explore-btn');
  btn.disabled = true;
  document.getElementById('results').style.display = 'none';
  setStatus('Reading the article and consulting Jewish texts… (this takes ~10 seconds)');

  try {
    const res = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || 'An error occurred. Please try again.');
    }

    // Populate results
    document.getElementById('res-title').textContent    = data.title    || 'Article';
    document.getElementById('res-headline').textContent = data.headline || '';
    document.getElementById('res-url').textContent      = url;
    document.getElementById('res-lens').innerHTML       = `<strong>Jewish perspective:</strong> ${data.jewish_lens || ''}`;

    renderTopics(data.topics || []);

    setStatus('');
    document.getElementById('results').style.display = 'block';
    document.getElementById('article-banner').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    setStatus(err.message || 'Something went wrong. Please try again.', true);
  } finally {
    btn.disabled = false;
  }
});
</script>

<script data-goatcounter="https://antoineleboyer.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
